     CONTACT SECTION — paste this whole block into its own
     Squarespace "Code Block" (Embed / Code element), set to HTML.

     This form POSTs to your Formspree form:
         action="https://formspree.io/f/xyeyeypy"
     The first submission may still require a one-time confirmation
     click on whatever inbox is tied to this form in your Formspree
     dashboard — after that, every submission forwards automatically.

     Optional: uncomment the hidden "_next" field below and set it
     to a page on your own site if you'd like visitors redirected
     there after submitting, instead of Formspree's generic page.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
  }

  #joannaContact {
    --ink: #E8E1CE;
    --muted: #B3AA8F;
    --panel: rgba(37, 34, 31, 0.82);
    --accent: #9A8F71;
    --blue: #1E252B;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    box-sizing: border-box;
  }
  #joannaContact * { box-sizing: border-box; }

  #joannaContact .contact-wrap {
    width: 100%;
    height: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  #joannaContact .contact-card {
    width: 100%;
    max-width: 680px;
    background: var(--panel);
    border: 1px solid var(--accent);
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 1px rgba(201,154,107,0.25),
      0 24px 60px rgba(0,0,0,0.5);
    padding: 2rem 2.5rem;
    color: var(--ink);
  }

  #joannaContact h1 {
    margin: 0 0 12px;
    font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    color: var(--ink);
  }

  #joannaContact .intro {
    margin: 0 0 20px;
    font-size: 16px;
    line-height: 1.55;
    color: var(--muted);
  }

  #joannaContact label {
    display: block;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  #joannaContact .field {
    margin-bottom: 14px;
  }

  #joannaContact input[type="text"],
  #joannaContact input[type="email"],
  #joannaContact textarea {
    width: 100%;
    padding: 10px 14px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(201, 154, 107, 0.4);
    border-radius: 4px;
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 16px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  #joannaContact input[type="text"]:focus,
  #joannaContact input[type="email"]:focus,
  #joannaContact textarea:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(0, 0, 0, 0.3);
  }

  #joannaContact textarea {
    resize: vertical;
    min-height: 90px;
  }

  #joannaContact .submit-btn {
    display: inline-block;
    width: 100%;
    padding: 14px 20px;
    margin-top: 6px;
    background: var(--blue);
    border: 1px solid var(--accent);
    border-radius: 4px;
    color: var(--ink);
    font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif;
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.15s ease;
  }

  #joannaContact .submit-btn:hover {
    background: var(--accent);
    color: #2a1c16;
    transform: translateY(-2px);
  }
</style>

<div id="joannaContact">
  <div class="contact-wrap">
    <div class="contact-card">
      <h1>Get in Touch</h1>
      <p class="intro">Have a question about lessons, level placement, or scheduling? Send a note below and Joanna will get back to you soon.</p>

      <form action="https://formspree.io/f/xyeyeypy" method="POST">
        <div class="field">
          <label for="jc-name">Name</label>
          <input type="text" id="jc-name" name="name" required>
        </div>
        <div class="field">
          <label for="jc-email">Email</label>
          <input type="email" id="jc-email" name="email" required>
        </div>
        <div class="field">
          <label for="jc-message">Message</label>
          <textarea id="jc-message" name="message" required></textarea>
        </div>

        <!-- Optional: redirect to a page on your own site after submit -->
        <!-- <input type="hidden" name="_next" value="https://yoursite.com/thank-you" /> -->

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </div>
</div>
