# Makes small, fast-loading copies of the background photos.
# Runs by itself whenever photos in Love/ or Love/Farm/ change, and you can
# also run it by hand: Actions tab → "Shrink photos" → "Run workflow".
# Your original photos are never changed.
name: Shrink photos

on:
  push:
    branches: [main]
    paths:
      - "Love/**"
      - "!Love/small/**"
      - "!Love/Farm/small/**"
      - "!Love/photos.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow

      - name: Make small copies + photos.json
        run: |
          cat > /tmp/build_photos.py << 'PYEOF'
          """
          Makes small, fast-loading copies of the background photos and a list of them.

            Love/small/<name>.jpg        small copies of the photos in Love/
            Love/Farm/small/<name>.jpg   small copies of the photos in Love/Farm/
            Love/photos.json             every photo + its shape, so the page doesn't
                                         have to download photos just to measure them

          Your original photos are never changed. Run automatically by the GitHub
          Action in .github/workflows/photos.yml whenever you add or change photos.
          """
          import json, os, sys
          from PIL import Image, ImageOps

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "."
          LOVE = os.path.join(ROOT, "Love")
          SETS = {"default": "", "farm": "Farm"}   # set name -> folder inside Love/
          MAX_SIDE = 1000       # longest edge of the small copies, in pixels
          QUALITY = 78
          EXTS = (".jpg", ".jpeg", ".png", ".webp", ".gif")

          manifest = {}
          for set_name, sub in SETS.items():
              src_dir = os.path.join(LOVE, sub)
              out_dir = os.path.join(src_dir, "small")
              if not os.path.isdir(src_dir):
                  manifest[set_name] = []
                  continue
              os.makedirs(out_dir, exist_ok=True)
              entries, keep = [], set()
              for name in sorted(os.listdir(src_dir), key=str.lower):
                  src = os.path.join(src_dir, name)
                  if not os.path.isfile(src) or not name.lower().endswith(EXTS):
                      continue
                  out_name = os.path.splitext(name)[0] + ".jpg"
                  out = os.path.join(out_dir, out_name)
                  try:
                      with Image.open(src) as im:
                          im = ImageOps.exif_transpose(im)      # respect phone rotation
                          w, h = im.size
                          im = im.convert("RGB")
                          im.thumbnail((MAX_SIDE, MAX_SIDE), Image.LANCZOS)
                          im.save(out, "JPEG", quality=QUALITY, optimize=True, progressive=True)
                  except Exception as e:
                      print(f"  skipped {os.path.join(sub, name)} ({e})")
                      continue
                  keep.add(out_name)
                  rel = "/".join(p for p in (sub, "small", out_name) if p)
                  entries.append({"file": rel, "name": name, "ratio": round(w / h, 4)})
              # remove small copies whose original was deleted
              for old in os.listdir(out_dir):
                  if old not in keep:
                      os.remove(os.path.join(out_dir, old))
              manifest[set_name] = entries
              print(f"{set_name}: {len(entries)} photos")

          with open(os.path.join(LOVE, "photos.json"), "w") as f:
              json.dump(manifest, f, indent=1)
          PYEOF
          python /tmp/build_photos.py .

      - name: Save them to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A Love/small Love/Farm/small Love/photos.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update small photos"
            git pull --rebase   # in case the other workflow saved something first
            git push
          fi
