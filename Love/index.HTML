<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Photo Grid Background</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }

  .grid {
    display: grid;
    width: 100vw;
    height: 100vh;
    gap: 6px;
    background-color: #ffffff;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-template-areas:
      "p1  t1  p2  p3  p4  t3"
      "p5  t1  p6  p7  p8  t3"
      "p9  p10 p11 t2  p12 p13"
      "p14 p15 p16 t2  p17 p18";
  }

  .cell {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #e9e4da; /* shows briefly while an image loads */
  }
</style>
</head>
<body>

  <div class="grid" id="grid"></div>

  <script>
    // ---------------------------------------------------------------
    // 1. List every photo in your images/ folder here, exactly as the
    //    filename appears (spaces and capitalization included). That's
    //    the only thing you need to edit when you add or remove photos.
    // ---------------------------------------------------------------
    const images = [
      "Bonsai.jpg", "LA hike 2.jpg", "LA hike.jpg", "SF hike 3.jpg",
      "SF hike.jpg", "SF top 3.jpg", "SF top 4.jpg", "Soy.jpg",
      "airport.jpg", "cabin.jpg", "engagement.jpg", "fireworks 2.jpg",
      "fireworks.jpg", "getty 2.jpg", "getty.jpg", "graduation dinner.jpg",
      "island.jpg", "mission college.jpg", "rain funny.jpg", "s+J.jpg",
      "santa fe lib.jpg", "santa fe statue.jpg", "tiny house 2.jpg",
      "tiny house.jpg", "top of SF 2.jpg", "top of SF.jpg", "train.jpg",
      "veggies market.jpg", "water rocks.jpg", "water tower.jpg", "yacht 2.jpg"
    ];

    // ---------------------------------------------------------------
    // 2. Optional per-photo crop overrides. Most photos look fine with
    //    the default centered crop, but every so often (like this cabin
    //    photo, where both faces sit left of center) the default crop
    //    needs nudging. Format: "filename": "x% y%".
    // ---------------------------------------------------------------
    const CROP_OVERRIDES = {
      "cabin.jpg": "30% 40%"
    };

    // A width/height ratio below this counts as a "tall" (portrait) photo.
    const PORTRAIT_THRESHOLD = 0.95;

    // Slot ids exactly as named in the grid-template-areas above.
    const landscapeSlots = ["p1","p2","p3","p4","p5","p6","p7","p8","p9","p10",
                             "p11","p12","p13","p14","p15","p16","p17","p18"];
    const tallSlots = ["t1", "t2", "t3"];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Load an image just far enough to read its natural dimensions.
    function probe(filename) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({
          filename,
          ratio: img.naturalWidth / img.naturalHeight
        });
        img.onerror = () => resolve(null); // skip files that fail to load
        img.src = "images/" + encodeURIComponent(filename);
      });
    }

    function makeCell(areaName, filename) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.gridArea = areaName;
      cell.style.backgroundImage = `url(images/${encodeURIComponent(filename)})`;
      cell.style.backgroundPosition = CROP_OVERRIDES[filename] || "center";
      grid.appendChild(cell);
    }

    const grid = document.getElementById("grid");

    Promise.all(images.map(probe)).then((results) => {
      const valid = results.filter(Boolean);
      const landscapePool = shuffle(valid.filter(r => r.ratio >= PORTRAIT_THRESHOLD).map(r => r.filename));
      const tallPool = shuffle(valid.filter(r => r.ratio < PORTRAIT_THRESHOLD).map(r => r.filename));

      landscapeSlots.forEach((slot, i) => {
        if (landscapePool.length > 0) makeCell(slot, landscapePool[i % landscapePool.length]);
      });
      tallSlots.forEach((slot, i) => {
        if (tallPool.length > 0) makeCell(slot, tallPool[i % tallPool.length]);
      });
    });
  </script>

</body>
</html>
