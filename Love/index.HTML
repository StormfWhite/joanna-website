<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Random Photo Grid Background</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh; /* accounts for mobile browser chrome so nothing is cut off or leaves a gap */
    overflow: hidden;
    background: #ffffff;
  }

  .grid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: grid;
    gap: 6px;
    background-color: #ffffff;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-template-areas:
      "p1  t1  p2  p3  p4  t3"
      "p5  t1  p6  p7  p8  t3"
      "p9  p10 p11 t2  p12 p13"
      "p14 p15 p16 t2  p17 p18";
  }

  .cell {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #e9e4da; /* shows briefly while an image loads */
  }
</style>
</head>
<body>

  <div class="grid" id="grid"></div>

  <script>
    // ---------------------------------------------------------------
    // 1. Point this at your GitHub repo + the folder containing your
    //    photos. The page will ask GitHub what's in that folder every
    //    time it loads — add or remove photos on GitHub and you're
    //    done, no code changes needed.
    // ---------------------------------------------------------------
    const GITHUB_OWNER = "StormfWhite";
    const GITHUB_REPO = "joanna-website";
    const GITHUB_PATH = "background/images"; // folder path within the repo
    const GITHUB_BRANCH = "main";

    // Fallback list used only if the GitHub API call fails (e.g. rate
    // limited). Keep this roughly up to date as a safety net.
    const FALLBACK_IMAGES = [
      "Bonsai.jpg", "LA hike 2.jpg", "LA hike.jpg", "SF hike 3.jpg",
      "SF hike.jpg", "SF top 3.jpg", "SF top 4.jpg", "Soy.jpg",
      "airport.jpg", "cabin.jpg", "engagement.jpg", "fireworks 2.jpg",
      "fireworks.jpg", "getty 2.jpg", "getty.jpg", "graduation dinner.jpg",
      "island.jpg", "mission college.jpg", "rain funny.jpg", "s+J.jpg",
      "santa fe lib.jpg", "santa fe statue.jpg", "tiny house 2.jpg",
      "tiny house.jpg", "top of SF 2.jpg", "top of SF.jpg", "train.jpg",
      "veggies market.jpg", "water rocks.jpg", "water tower.jpg", "yacht 2.jpg"
    ];

    // ---------------------------------------------------------------
    // 2. Optional per-photo crop overrides. Most photos look fine with
    //    the default centered crop, but every so often (like this cabin
    //    photo, where both faces sit left of center) the default crop
    //    needs nudging. Format: "filename": "x% y%".
    // ---------------------------------------------------------------
    const CROP_OVERRIDES = {
      "cabin.jpg": "30% 40%"
    };

    // A width/height ratio below this counts as a "tall" (portrait) photo.
    const PORTRAIT_THRESHOLD = 0.95;

    // Slot ids exactly as named in the grid-template-areas above.
    const landscapeSlots = ["p1","p2","p3","p4","p5","p6","p7","p8","p9","p10",
                             "p11","p12","p13","p14","p15","p16","p17","p18"];
    const tallSlots = ["t1", "t2", "t3"];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Ask GitHub what image files currently live in the folder.
    async function fetchImageList() {
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}?ref=${GITHUB_BRANCH}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("GitHub API request failed: " + res.status);
        const data = await res.json();
        const names = data
          .filter(item => item.type === "file" && /\.(jpe?g|png|webp)$/i.test(item.name))
          .map(item => item.name);
        if (names.length === 0) throw new Error("No images found via API");
        return names;
      } catch (err) {
        console.warn("Falling back to hardcoded image list:", err);
        return FALLBACK_IMAGES;
      }
    }

    // Load an image just far enough to read its natural dimensions.
    function probe(filename) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({
          filename,
          ratio: img.naturalWidth / img.naturalHeight
        });
        img.onerror = () => resolve(null); // skip files that fail to load
        img.src = "../background/images/" + encodeURIComponent(filename);
      });
    }

    function makeCell(areaName, filename) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.gridArea = areaName;
      cell.style.backgroundImage = `url(../background/images/${encodeURIComponent(filename)})`;
      cell.style.backgroundPosition = CROP_OVERRIDES[filename] || "center";
      grid.appendChild(cell);
    }

    const grid = document.getElementById("grid");

    fetchImageList()
      .then(images => Promise.all(images.map(probe)))
      .then((results) => {
        const valid = results.filter(Boolean);
        const landscapePool = shuffle(valid.filter(r => r.ratio >= PORTRAIT_THRESHOLD).map(r => r.filename));
        const tallPool = shuffle(valid.filter(r => r.ratio < PORTRAIT_THRESHOLD).map(r => r.filename));

        landscapeSlots.forEach((slot, i) => {
          if (landscapePool.length > 0) makeCell(slot, landscapePool[i % landscapePool.length]);
        });
        tallSlots.forEach((slot, i) => {
          if (tallPool.length > 0) makeCell(slot, tallPool[i % tallPool.length]);
        });
      });
  </script>

</body>
</html>
